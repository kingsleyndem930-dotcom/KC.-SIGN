<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F6B4F">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>KC Sign</title>
<style>
:root{--bg:#F2F6F3;--ink:#12231E;--mute:#586B64;--card:#FFFFFF;--line:#C5D3CC;--acc:#0F6B4F;--accfg:#FFFFFF;--hi:#D8F0E5;--bad:#B3261E;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101B17;--ink:#E5F0EB;--mute:#93A8A0;--card:#18282F;--line:#2E4540;--acc:#4CC79A;--accfg:#08231A;--hi:#1F4036;--bad:#F2B8B5}}
:root[data-theme="dark"]{--bg:#101B17;--ink:#E5F0EB;--mute:#93A8A0;--card:#18282F;--line:#2E4540;--acc:#4CC79A;--accfg:#08231A;--hi:#1F4036;--bad:#F2B8B5}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:520px;margin:0 auto;padding:24px 16px 40px}
h1{font-size:1.6rem;margin:0 0 4px;line-height:1.2}
.sub,.note{color:var(--mute)}.note{font-size:.9rem}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-top:14px}
button{font:inherit;font-weight:600;border-radius:999px;padding:12px 18px;cursor:pointer;border:1.5px solid var(--acc);background:none;color:var(--acc)}
button.p{background:var(--acc);color:var(--accfg)}
button.live{background:var(--bad);border-color:var(--bad);color:#fff}
button.s{padding:8px 14px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#home{text-align:center}
#home .sub{max-width:320px;margin:8px auto 24px}
.hero{background:#fff;border-radius:20px;padding:8px;max-width:280px;margin:12px auto 16px;box-shadow:0 2px 12px rgba(0,0,0,.12)}
.hero img{width:100%;height:auto;display:block;border-radius:14px}
.logo{width:96px;height:96px;border-radius:24px;background:var(--acc);color:var(--accfg);font:800 2.4rem/96px system-ui,sans-serif;text-align:center;margin:32px auto 16px}
.col{display:flex;flex-direction:column;gap:10px;max-width:320px;margin:0 auto}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
#cap{min-height:96px;max-height:200px;overflow-y:auto;font-size:var(--cs,1.15rem)}
#cap .i{color:var(--mute)}
textarea{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px;width:100%;min-height:60px}
#sw{position:relative;margin-top:14px;background:var(--bg)}
#stage{margin-top:0;min-height:210px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
#stage video{width:100%;max-height:260px;border-radius:10px;background:#000}
#sw:fullscreen{padding:12px;display:flex;flex-direction:column;justify-content:center}
#sw:fullscreen #stage video{max-height:65vh}
#sub{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(0,0,0,.75);color:#fff;border-radius:8px;padding:6px 10px;text-align:center;font-size:1.05rem;pointer-events:none}
#sub:empty{display:none}
.big{font-size:2.2rem;font-weight:700;line-height:1.1;overflow-wrap:anywhere}
#q{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{padding:4px 10px;border:1.5px solid var(--line);border-radius:8px;font-size:.9rem}.chip.on{background:var(--hi);border-color:var(--acc)}
#msg{min-height:1.4em;margin-top:8px;font-size:.9rem;color:var(--mute)}
label.t{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:.95rem}
</style>
</head>
<body>
<main>
<section id="home">
<div class="hero"><img src="assets/file_000000006a6c71f4a53db65df4b16a56.png" alt="Krystalcare logo" onerror="this.parentNode.hidden=true;document.getElementById('kc').hidden=false"></div>
<div class="logo" id="kc" hidden aria-hidden="true">KC</div>
<h1>KC Sign</h1>
<p class="sub">Live captions and Nigerian Sign Language clips for approved phrases.</p>
<div class="col"><button class="p" id="start" type="button">Start</button></div>
<p class="note" style="margin-top:20px">Early version. It shows signs only for phrases with a recorded, approved clip. It is not a replacement for a human interpreter.</p>
</section>

<div id="app" hidden>
<button id="back" type="button">← Home</button>
<h1 style="margin-top:12px">Live</h1>
<div class="row"><button class="p" id="mic" type="button">Start listening</button><button id="clr" type="button">Clear</button></div>
<div id="msg" role="status"></div>
<div class="row"><span class="note">Caption size</span><button class="s" id="sm" type="button" aria-label="Smaller text">A−</button><button class="s" id="lg" type="button" aria-label="Larger text">A+</button></div>
<div class="card" id="cap" aria-live="polite"><span class="i">Captions appear here as people speak.</span></div>
<div id="sw">
<div class="card" id="stage" aria-live="polite"><span class="note">Signs will appear here.</span></div>
<div id="sub"></div>
</div>
<div class="row"><button class="s" id="fsb" type="button">Full screen</button></div>
<div id="q"></div>
<label class="t"><input type="checkbox" id="sb" checked> Show subtitles on the sign video</label>
<label class="t"><input type="checkbox" id="fs"> Fingerspell words with no clip (uses clips/letter_a.mp4 and so on)</label>
<div class="card">
<label for="txt" class="note">Or type instead</label>
<textarea id="txt" placeholder="Type English here"></textarea>
<div class="row"><button class="p" id="go" type="button">Show signs</button></div>
</div>
<p class="note" id="lib"></p>
</div>
</main>
<script>
var $=function(i){return document.getElementById(i)};
var LIB={},queue=[],playing=false,rec=null,listening=false,finalText='',lastFinal='',lastAt=0,capSize=1.15;

function norm(t){return t.toLowerCase().replace(/[^a-z' ]+/g,' ').replace(/\s+/g,' ').trim()}
function enqueue(it){queue.push(it);drawQ(-1);if(!playing)next()}
function drawQ(cur){
  var q=$('q');q.textContent='';
  queue.slice(0,12).forEach(function(t,k){var c=document.createElement('span');c.className='chip'+(k===0&&cur===0?' on':'');c.textContent=t.label;q.appendChild(c)});
}
function stage(el){var s=$('stage');s.textContent='';s.appendChild(el)}
function card(big,note){
  var d=document.createElement('div'),b=document.createElement('div'),n=document.createElement('div');
  b.className='big';b.textContent=big;n.className='note';n.textContent=note;d.appendChild(b);d.appendChild(n);return d;
}
function next(){
  if(!queue.length){playing=false;drawQ(-1);stage(card(listening?'Listening…':'Done',listening?'Approved phrases will play here.':'Press Start listening or type a phrase.'));return}
  playing=true;var t=queue.shift();queue.unshift(t);drawQ(0);
  function done(){queue.shift();next()}
  if(t.url){
    var v=document.createElement('video');v.autoplay=true;v.muted=true;v.playsInline=true;v.controls=true;
    v.onended=done;v.onerror=function(){stage(card(t.label,'This clip could not be loaded.'));setTimeout(done,1500)};
    v.src=t.url;stage(v);
  }else{stage(card(t.label,'No clip for this yet.'));setTimeout(done,900)}
}
function handle(text){
  var w=norm(text).split(' ').filter(Boolean),i=0,found=0;
  while(i<w.length){
    var hit=0;
    for(var n=Math.min(5,w.length-i);n>0;n--){
      var p=w.slice(i,i+n).join(' ');
      if(LIB[p]){enqueue({label:p,url:LIB[p]});hit=n;found++;break}
    }
    if(hit){i+=hit;continue}
    if($('fs').checked){
      w[i].replace(/[^a-z]/g,'').split('').forEach(function(ch){enqueue({label:ch.toUpperCase(),url:'clips/letter_'+ch+'.mp4'})});
    }
    i++;
  }
  if(!found&&Object.keys(LIB).length===0)$('msg').textContent='No sign clips added yet. Add clips to the clips folder and list them in clips/clips.json.';
}
function showCaps(fin,interim){
  var c=$('cap');c.textContent='';
  if(!fin&&!interim){var s=document.createElement('span');s.className='i';s.textContent='Captions appear here as people speak.';c.appendChild(s)}
  else{
    c.appendChild(document.createTextNode(fin));
    var i=document.createElement('span');i.className='i';i.textContent=interim;c.appendChild(i);
    c.scrollTop=c.scrollHeight;
  }
  var words=(fin+interim).trim().split(/\s+/).filter(Boolean);
  $('sub').textContent=$('sb').checked?words.slice(-14).join(' '):'';
}
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function startL(){
  if(!SR){$('msg').textContent='Voice input isn’t supported in this browser. Use Chrome, or type instead.';return}
  rec=new SR();rec.lang='en-NG';rec.continuous=true;rec.interimResults=true;
  rec.onresult=function(e){
    var interim='';
    for(var i=e.resultIndex;i<e.results.length;i++){
      var r=e.results[i],tx=r[0].transcript;
      if(r.isFinal){
        var now=Date.now();
        if(norm(tx)&&!(norm(tx)===lastFinal&&now-lastAt<2500)){finalText+=tx.trim()+' ';handle(tx)}
        lastFinal=norm(tx);lastAt=now;
      }else interim+=tx;
    }
    showCaps(finalText,interim);
  };
  rec.onerror=function(e){
    var m=(e.error==='not-allowed'||e.error==='service-not-allowed')?'Microphone access is blocked. Allow it in Chrome’s site settings, or type instead.':e.error==='no-speech'?'':'Listening problem ('+e.error+').';
    if(m)$('msg').textContent=m;
    if(e.error==='not-allowed'||e.error==='service-not-allowed')stopL();
  };
  rec.onend=function(){if(listening){try{rec.start()}catch(x){}}};
  try{rec.start();listening=true;$('mic').textContent='Stop listening';$('mic').className='live';$('msg').textContent='Listening…';if(!playing)next()}
  catch(x){$('msg').textContent='Couldn’t start the microphone. Type instead.'}
}
function stopL(){listening=false;try{rec&&rec.stop()}catch(x){}$('mic').textContent='Start listening';$('mic').className='p';if($('msg').textContent==='Listening…')$('msg').textContent='';if(!playing)next()}
function setSize(d){capSize=Math.max(.9,Math.min(2.6,capSize+d));$('cap').style.setProperty('--cs',capSize+'rem');$('sub').style.fontSize=(capSize-.1)+'rem'}
$('mic').className='p';
$('mic').onclick=function(){listening?stopL():startL()};
$('clr').onclick=function(){finalText='';queue=[];playing=false;showCaps('','');drawQ(-1);stage(card('…','Cleared.'))};
$('go').onclick=function(){$('msg').textContent='';handle($('txt').value)};
$('sm').onclick=function(){setSize(-.15)};
$('lg').onclick=function(){setSize(.15)};
$('sb').onchange=function(){showCaps(finalText,'')};
$('fsb').onclick=function(){
  var e=$('sw');
  if(document.fullscreenElement){document.exitFullscreen()}
  else if(e.requestFullscreen){e.requestFullscreen().catch(function(){$('msg').textContent='Full screen isn’t available here.'})}
  else $('msg').textContent='Full screen isn’t supported in this browser.';
};
$('start').onclick=function(){$('home').hidden=true;$('app').hidden=false;window.scrollTo(0,0)};
$('back').onclick=function(){stopL();queue=[];$('app').hidden=true;$('home').hidden=false};
fetch('clips/clips.json').then(function(r){return r.ok?r.json():{}}).then(function(m){
  Object.keys(m).forEach(function(k){LIB[norm(k)]='clips/'+m[k]});
  var n=Object.keys(LIB).length;
  $('lib').textContent=n?('Approved phrases: '+Object.keys(LIB).join(', ')+'.'):'No approved sign clips yet.';
}).catch(function(){$('lib').textContent='No approved sign clips yet.'});
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}
</script>
</body>
  </html>
